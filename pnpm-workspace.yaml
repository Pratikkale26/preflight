packages:
  - 'packages/*'
  - 'apps/*'

# esbuild is vitest's bundler; its install script fetches the platform binary.
# The rest are optional native accelerations pulled in by @solana/web3.js. They
# have pure-JS fallbacks, so we decline the native builds rather than compile them.
allowBuilds:
  esbuild: true
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
